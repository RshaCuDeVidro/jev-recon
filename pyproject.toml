[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-recon"
version = "0.1.0"
description = "Prioritize subdomains for security research with Jev (TypeSafe) as a probabilistic decision layer"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jev-recon = "jev_recon.cli:main"

[tool.setuptools]
packages = ["jev_recon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
